# Alembic configuration .
#
# NOTE (important): keep this file ASCII-only.
#   Alembic reads this ini with the *system locale* encoding (on a Chinese Windows
#   that is GBK), so any non-GBK character (arrows, emoji, some CJK punctuation)
#   makes alembic fail to start with a "codec can't decode" error.
#   The Chinese explanation of what alembic is and how to use it lives in
#   migrations/env.py instead.
#
# Quick usage (run from the backend directory):
#   alembic current                  -> show which revision the DB is on
#   alembic upgrade head             -> apply all pending migrations
#   alembic downgrade -1             -> roll back one step
#   alembic revision --autogenerate -m "add something"   -> create a new migration
#
# First time on an EXISTING database (the one already running in production):
#   alembic stamp head               -> tell alembic "the schema is already up to date"
#   (without this, alembic thinks the DB is empty and tries to CREATE the tables
#    that already exist, which fails.)

[alembic]
script_location = migrations

# File name template: date first so migrations sort chronologically in a file list
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# The database URL is intentionally left empty here: migrations/env.py reads it
# from the project config (.env) instead. Keeping a single source of truth
# avoids the classic accident of "migration ran against DB A while the service
# talks to DB B", and avoids committing credentials into this file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
