name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送取消上一次还在跑的构建，省时间也省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- 后端：单元测试 ----------------
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行单元测试
        working-directory: backend
        env:
          # CI 里不连真实数据库/向量库：测试用 SQLite，AI 调用走 mock
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-only-not-a-real-secret-0123456789abcdef"
          ADMIN_PASSWORD: "ci-only-not-a-real-password"
          LLM_MOCK: "true"
          APP_ENV: "dev"
        run: python -m unittest discover -s tests -t . -v

  # ---------------- 前端：类型检查 + 构建 ----------------
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查与构建
        working-directory: frontend
        run: npm run build

  # ---------------- 密钥扫描：防止误提交密钥 ----------------
  secret-scan:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks 需要完整历史才能查全，只取最新一次会漏
          fetch-depth: 0

      - name: 用 gitleaks 扫描历史与当前代码
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
