name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送取消上一次还在跑的构建，省时间也省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- 后端：单元测试 ----------------
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    # 起一个真实 PostgreSQL：并发额度测试必须跑在真数据库上才有意义。
    # SQLite 内存库是单连接，并发请求实际是排队的，永远测不出竞态。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kbqa
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: kbqa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kbqa -d kbqa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行单元测试
        working-directory: backend
        env:
          # CI 里不连真实数据库/向量库：测试用 SQLite，AI 调用走 mock
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-only-not-a-real-secret-0123456789abcdef"
          ADMIN_PASSWORD: "ci-only-not-a-real-password"
          LLM_MOCK: "true"
          APP_ENV: "dev"
          # 下面两个是**假的占位 Key**，只为让客户端构造函数不报 "Missing credentials"。
          # 有测试要验证"超时参数有没有真的落到 httpx.Timeout 上"，
          # 这一步必须真的构造客户端对象，但绝不会发出任何网络请求。
          # 真正的密钥只存在于开发者本地 .env，从不进入仓库。
          LLM_API_KEY: "ci-fake-key-not-real"
          EMBEDDING_API_KEY: "ci-fake-key-not-real"
          # 指向上面 services 起的真实 PostgreSQL，让并发额度测试真正执行
          # （不设这一项，那 2 个并发用例会被 skip —— 等于没测）
          KBQA_TEST_PG_URL: "postgresql+asyncpg://kbqa:ci-test-password@127.0.0.1:5432/kbqa_test"
        run: python -m unittest discover -s tests -t . -v

  # ---------------- 前端：类型检查 + 构建 ----------------
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查与构建
        working-directory: frontend
        run: npm run build

      # 依赖漏洞审计。
      #
      # ⚠️ 坑一：`npm audit --audit-level=high` **只影响显示内容，不影响退出码**。
      #   实测：项目里有 high 时它依然返回 0。直接写进 CI 等于摆设。
      #   所以下面自己解析 JSON 计数、主动 exit 1。
      #
      # ⚠️ 坑二：CI 里不能用 /tmp（Windows 本地跑会路径不存在），
      #   统一写到项目内的临时文件。
      #
      # 阈值为什么定在 critical 而不是 high：
      #   当前唯一的高危项是 vite（dev server 相关的 8 个公告），
      #   具体包括 server.fs.deny 绕过、launch-editor 命令注入等 ——
      #   这些**只在 `npm run dev` 起开发服务器时成立**，
      #   `npm run build` 产出的 dist/ 里根本没有 vite 代码，生产不受影响；
      #   且多条是 Windows 平台特定。
      #   修复它需要 vite 5 -> 8 跨两个主版本，回归风险大于实际收益。
      #   所以 CI 卡 critical；high 只在日志里列出来，提醒开发者知悉。
      #   等哪天升级了工具链，把这个门槛收紧回 high。
      - name: 依赖漏洞审计（critical 必须为 0）
        working-directory: frontend
        run: |
          npm audit --json > audit.json || true
          python3 - <<'PY'
          import json, sys

          try:
              data = json.load(open("audit.json"))
          except Exception as e:
              print(f"审计结果解析失败：{e}")
              sys.exit(1)

          meta = data.get("metadata", {}).get("vulnerabilities", {})
          crit = int(meta.get("critical", 0))
          high = int(meta.get("high", 0))
          total = int(meta.get("total", 0))
          print(f"依赖漏洞统计：共 {total} 个（critical={crit}, high={high}）")

          vulns = data.get("vulnerabilities", {})
          for sev in ("critical", "high"):
              names = [n for n, v in vulns.items() if v.get("severity") == sev]
              if names:
                  print(f"  {sev}: {', '.join(names)}")

          if crit:
              print("发现 critical 级漏洞，必须修复后才能合并。")
              sys.exit(1)
          if high:
              print("注意：存在 high 级漏洞（当前为 dev server 相关，不阻塞合并，详见注释）。")
          print("通过。")
          PY

  # ---------------- 密钥扫描：防止误提交密钥 ----------------
  secret-scan:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks 需要完整历史才能查全，只取最新一次会漏
          fetch-depth: 0

      - name: 用 gitleaks 扫描历史与当前代码
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
