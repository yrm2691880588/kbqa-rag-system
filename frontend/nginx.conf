# ============================================================
# 前端站点配置（生产）
# 职责：① 托管前端静态文件  ② 把 /api 请求转发给后端容器
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传文件体积上限。
    # ⚠️ 这个数字和后台配置 MAX_UPLOAD_MB（默认 100MB）是**一对**，必须一起改：
    #   · 只改后端不改这里 → 大文件被 nginx 先拦下，报的是 nginx 的 413，
    #     而后端的错误提示根本来不及出现，运维容易以为是后端问题；
    #   · 只改这里不改后端 → 文件传到后端才被拒，白传一趟（浪费客户流量和时间）。
    # 这里比后端上限多留 20MB 余量给表单的其它字段。
    client_max_body_size 120m;

    # 压缩：文本类资源传输体积可减小约 70%
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- 接口反向代理 ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # 传递真实客户端信息（后端登录/注册限流依赖真实 IP，必须传）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ★ 关键：AI 回答是"流式"返回的（一个字一个字推送）。
        #   若开启缓冲，nginx 会把内容攒满一整块才发给浏览器，
        #   用户会看到"卡很久然后一次性蹦出一大段"，失去流式体验。
        proxy_buffering off;
        proxy_cache off;

        # 长回答的读取超时（AI 生成较慢，给足时间）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- 申请/续期 HTTPS 证书的校验目录 ----
    # Let's Encrypt 会访问 http://你的域名/.well-known/acme-challenge/<随机串>
    # 来确认域名确实指向这台服务器。该目录与证书申请脚本共享同一个数据卷。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- 前端静态资源 ----
    # 构建产物带内容哈希，内容变化时文件名也变，可安全长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 单页应用（SPA）路由回退：刷新 /chat 这类前端路由时，
    # 服务器上并不存在该文件，需要回退到 index.html 交给前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 基础安全响应头 ----
    add_header X-Content-Type-Options nosniff always;                       # 禁止浏览器猜测文件类型
    add_header X-Frame-Options SAMEORIGIN always;                           # 防点击劫持（禁止被其他站点嵌套）
    add_header Referrer-Policy strict-origin-when-cross-origin always;      # 控制来源信息外泄
}
